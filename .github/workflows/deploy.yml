name: deploy

# Continuous deployment.
#
# Manual runs (workflow_dispatch) or a version tag (v1.2.3) build a release and
# sync it to the target server, then run the remote release steps.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      e.g. attendrly.com
#   DEPLOY_USER      e.g. deploy
#   DEPLOY_PATH      e.g. /var/www/attendrly
#   DEPLOY_SSH_KEY   private key with access to the server
# Optional:
#   DEPLOY_PORT      defaults to 22
#
# If the secrets are not configured the workflow skips instead of failing, so
# forks and pull requests stay green.

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: Skip `php artisan migrate` on the server
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare release tree
        run: |
          # Storage and .env are server-owned; never ship them.
          rm -rf storage/logs/*.log storage/framework/cache/data/* storage/framework/views/* || true

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attendrly-release
          include-hidden-files: true
          retention-days: 5
          path: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            vendor
            artisan
            composer.json
            composer.lock
            package.json
            package-lock.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ -n "$DEPLOY_HOST" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST is not configured — skipping deployment."
          fi

      - name: Download release artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attendrly-release
          path: release

      - name: Setup SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync release
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete --human-readable \
            --exclude '.env' --exclude '.env.*' --exclude 'storage/' \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            release/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Run remote release steps
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SKIP_MIGRATIONS: ${{ github.event.inputs.skip_migrations }}
        run: |
          ssh -p "${DEPLOY_PORT}" -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" SKIP_MIGRATIONS="${SKIP_MIGRATIONS}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          php artisan down --retry=15 || php artisan down || true
          restore() { php artisan up || true; }
          trap restore EXIT

          if [ "${SKIP_MIGRATIONS:-false}" != "true" ]; then
            php artisan migrate --force
          fi

          php artisan storage:link || true
          php artisan optimize
          php artisan queue:restart || true
          php artisan reverb:restart || true
          REMOTE
